executor: slurm
software-deployment-method:
  - conda
conda-prefix: .conda

jobs: 40
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

resources: # cap concurrent hits on the ENCODE API
  encode_api: 4

default-resources:
  slurm_account: ramirezc
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4000
  # slurm_extra: "--exclude=node1,node2"   # e.g. nodes missing a shared mount

set-threads:
  report_parquet: 4

set-resources:
  fetch_report:
    mem_mb: 1000
    runtime: 180m
  clean_report:
    mem_mb: 2000
    runtime: 60m
  report_parquet:
    mem_mb: 32000
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
